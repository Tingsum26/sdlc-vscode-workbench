name: Verify internal TODO registry

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'central/**'
      - 'docs/handoff/INTERNAL_TODO.md'
      - 'docs/handoff/internal-todo-registry.json'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/verify-internal-todos.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'central/**'
      - 'docs/handoff/INTERNAL_TODO.md'
      - 'docs/handoff/internal-todo-registry.json'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/verify-internal-todos.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:workflow-security
      - run: pnpm verify:internal-todos
